<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>RIFTWELT 3D</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#04070c;color:#e8eefb;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .screen{position:fixed;inset:0;display:none;z-index:1}
  .screen.on{display:flex}

  /* ============ MENÜ ============ */
  #menuScreen{
    flex-direction:column;align-items:center;justify-content:center;padding:24px;
    background:
      radial-gradient(50% 50% at 20% 10%,rgba(34,211,238,.18),transparent 60%),
      radial-gradient(50% 50% at 80% 10%,rgba(167,139,250,.18),transparent 60%),
      radial-gradient(50% 50% at 50% 90%,rgba(251,146,60,.10),transparent 60%),
      #04070c;
    text-align:center;z-index:100;overflow-y:auto
  }
  .logo{
    font-size:clamp(2.6rem,10vw,5.5rem);font-weight:900;letter-spacing:-.04em;line-height:1;
    background:linear-gradient(100deg,#fff 8%,#22d3ee 40%,#a78bfa 72%,#fb923c 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:8px;
  }
  .subtitle{color:#93a2bb;font-size:.92rem;font-weight:600;letter-spacing:.06em;
    text-transform:uppercase;margin-bottom:34px}
  .pick-title{font-size:.78rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
    color:#22d3ee;margin-bottom:16px}
  .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:560px;width:100%;
    margin-bottom:28px}
  @media(max-width:520px){.mode-grid{grid-template-columns:1fr}}
  .mode-btn{
    background:rgba(255,255,255,.045);border:2px solid rgba(255,255,255,.1);
    border-radius:18px;padding:22px 18px;text-align:left;
    transition:transform .18s,border-color .18s,background .18s;color:#e8eefb
  }
  .mode-btn:hover{transform:translateY(-3px);background:rgba(255,255,255,.075)}
  .mode-btn.on{border-color:#22d3ee;background:rgba(34,211,238,.1);
    box-shadow:0 0 0 3px rgba(34,211,238,.15),0 20px 40px rgba(34,211,238,.15)}
  .mode-icon{font-size:2rem;margin-bottom:10px}
  .mode-title{font-size:1.05rem;font-weight:800;margin-bottom:4px}
  .mode-desc{font-size:.78rem;color:#93a2bb;line-height:1.4}
  .start-btn{
    padding:16px 44px;border-radius:999px;font-weight:800;font-size:1rem;
    background:linear-gradient(100deg,#22d3ee,#a78bfa);color:#04070d;
    box-shadow:0 16px 44px rgba(34,211,238,.35);transition:.2s;
  }
  .start-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 22px 50px rgba(34,211,238,.45)}
  .start-btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
  .mini-stats{margin-top:22px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center;
    color:#93a2bb;font-size:.78rem;font-weight:700}
  .mini-stats b{color:#22d3ee;font-weight:900}

  /* ============ SPIEL ============ */
  #gameScreen{flex-direction:column}
  #gameCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #hud{position:absolute;inset:0;pointer-events:none;padding:12px;
    display:flex;flex-direction:column;justify-content:space-between;z-index:2}
  .hud-top{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
  .hud-pill{background:rgba(4,7,12,.78);border:1px solid rgba(255,255,255,.14);
    border-radius:999px;padding:5px 14px;font-size:.76rem;font-weight:800;backdrop-filter:blur(6px)}
  #hudMenuBtn{position:absolute;top:12px;right:12px;width:42px;height:42px;border-radius:12px;
    background:rgba(4,7,12,.78);border:1px solid rgba(255,255,255,.14);
    display:grid;place-items:center;font-size:1.1rem;pointer-events:auto}
  #hudMenuBtn:hover{background:rgba(255,255,255,.1)}
  .hud-bottom{display:flex;flex-direction:column;gap:8px;max-width:360px}
  .hp-bar{position:relative;height:20px;border-radius:999px;overflow:hidden;
    background:rgba(4,7,12,.85);border:1px solid rgba(255,255,255,.14)}
  .hp-fill{position:absolute;left:0;top:0;height:100%;width:100%;
    background:linear-gradient(90deg,#34d399,#22d3ee);transition:width .15s}
  .hp-text{position:absolute;inset:0;display:grid;place-items:center;font-size:.72rem;
    font-weight:800;letter-spacing:.06em;text-shadow:0 1px 3px rgba(0,0,0,.8)}
  .res-bar{display:flex;gap:6px;background:rgba(4,7,12,.78);border:1px solid rgba(255,255,255,.14);
    border-radius:12px;padding:6px 12px;font-size:.78rem;font-weight:800;backdrop-filter:blur(6px)}
  .res-bar span{color:#93a2bb}
  .res-bar b{color:#22d3ee}

  #crosshair{position:absolute;top:50%;left:50%;width:18px;height:18px;margin:-9px 0 0 -9px;
    pointer-events:none;z-index:3;display:none}
  #crosshair::before,#crosshair::after{content:"";position:absolute;background:rgba(34,211,238,.85);
    box-shadow:0 0 8px rgba(34,211,238,.7)}
  #crosshair::before{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%)}
  #crosshair::after{top:50%;left:0;height:2px;width:100%;transform:translateY(-50%)}
  #crosshair.on{display:block}

  #damageFlash{position:absolute;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(circle at center,transparent 40%,rgba(248,113,113,.55));
    opacity:0;transition:opacity .1s}

  .pointer-hint{
    position:absolute;left:50%;top:70%;transform:translateX(-50%);
    background:rgba(4,7,12,.88);border:1px solid rgba(34,211,238,.4);
    padding:12px 24px;border-radius:14px;font-size:.86rem;font-weight:700;
    text-align:center;z-index:4;pointer-events:none;backdrop-filter:blur(8px);
    color:#22d3ee
  }

  /* ============ TOUCH-STEUERUNG ============ */
  #touchControls{display:none;position:absolute;inset:0;z-index:3;pointer-events:none}
  #touchControls.on{display:block}
  .joystick{position:absolute;bottom:20px;width:130px;height:130px;
    border-radius:50%;pointer-events:auto;touch-action:none}
  .joystick.left{left:20px}
  .joystick.right{right:20px}
  .joystick-base{position:absolute;inset:0;border-radius:50%;
    background:rgba(4,7,12,.55);border:2px solid rgba(34,211,238,.35);
    box-shadow:inset 0 0 24px rgba(34,211,238,.12)}
  .joystick-knob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;
    border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(34,211,238,.9),rgba(34,211,238,.5));
    box-shadow:0 0 20px rgba(34,211,238,.5);transition:transform .05s;
    pointer-events:none;will-change:transform}
  .touch-buttons{position:absolute;bottom:170px;right:20px;display:flex;flex-direction:column;gap:10px;
    align-items:flex-end;pointer-events:auto}
  .touch-weapon{width:56px;height:56px;border-radius:14px;
    background:rgba(4,7,12,.75);border:2px solid rgba(255,255,255,.16);
    font-size:1.4rem;display:grid;place-items:center;transition:.15s}
  .touch-weapon.active{border-color:#22d3ee;background:rgba(34,211,238,.2);
    box-shadow:0 0 16px rgba(34,211,238,.4)}
  .touch-extract{position:absolute;bottom:310px;right:20px;width:80px;height:80px;
    border-radius:50%;background:linear-gradient(135deg,#22d3ee,#a78bfa);color:#04070d;
    font-weight:900;font-size:1.1rem;line-height:1.05;
    box-shadow:0 0 30px rgba(34,211,238,.6);animation:pulseExtract 1.2s ease-in-out infinite}
  .touch-extract small{font-size:.6rem;display:block;letter-spacing:.06em}
  @keyframes pulseExtract{50%{transform:scale(1.08)}}

  /* ============ OVERLAY-SCREENS ============ */
  .overlay-screen{
    background:rgba(4,7,12,.94);z-index:200;backdrop-filter:blur(10px);
    flex-direction:column;padding:24px;overflow-y:auto;align-items:center;justify-content:flex-start
  }
  .panel-inner,.end-inner{
    width:100%;max-width:760px;margin:auto;
    background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.1);
    border-radius:20px;padding:24px
  }
  .panel-header{display:flex;justify-content:space-between;align-items:center;
    margin-bottom:16px;gap:12px}
  .panel-header h2{font-size:1.3rem;font-weight:800}
  .close-btn{width:36px;height:36px;border-radius:10px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
    font-size:1rem;display:grid;place-items:center;transition:.15s}
  .close-btn:hover{background:rgba(248,113,113,.2);border-color:rgba(248,113,113,.5)}
  .panel-tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:18px;
    padding-bottom:4px;scrollbar-width:none}
  .panel-tabs::-webkit-scrollbar{display:none}
  .panel-tabs button{padding:8px 14px;border-radius:999px;font-size:.8rem;font-weight:700;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
    white-space:nowrap;transition:.15s;color:#93a2bb}
  .panel-tabs button:hover{color:#e8eefb}
  .panel-tabs button.on{background:linear-gradient(100deg,#22d3ee,#a78bfa);color:#04070d;border-color:transparent}
  .panel-content{display:flex;flex-direction:column;gap:10px}

  .row{display:flex;align-items:center;gap:12px;padding:11px 0;
    border-bottom:1px solid rgba(255,255,255,.06)}
  .row:last-child{border-bottom:none}
  .row .grow{flex:1;min-width:0}
  .row .name{font-weight:800;font-size:.92rem}
  .row .desc{font-size:.78rem;color:#93a2bb;margin-top:2px}
  .bar{height:7px;border-radius:99px;background:rgba(255,255,255,.08);
    overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#a78bfa);
    transition:width .4s}
  .tag{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;
    padding:2px 9px;border-radius:99px;border:1px solid rgba(255,255,255,.14);color:#93a2bb}
  .tag.on{border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.12);color:#a7f3d0}
  .tag.gold{border-color:rgba(251,146,60,.5);background:rgba(251,146,60,.12);color:#fdba74}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:10px 20px;border-radius:999px;font-weight:800;font-size:.86rem;
    border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);
    color:#e8eefb;transition:.18s}
  .btn:hover:not(:disabled){background:rgba(255,255,255,.1);transform:translateY(-1px)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .btn.pri{background:linear-gradient(100deg,#22d3ee,#a78bfa);color:#04070d;border:none}
  .btn.sm{padding:6px 13px;font-size:.76rem}

  .end-inner{text-align:center}
  #endTitle{font-size:2rem;font-weight:900;margin-bottom:14px;
    background:linear-gradient(100deg,#22d3ee,#a78bfa);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  #endBody{color:#93a2bb;line-height:1.7;margin-bottom:24px;font-size:.94rem}
  #endBody strong{color:#e8eefb}
  .end-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

  .toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,100px);
    background:linear-gradient(100deg,#22d3ee,#a78bfa);color:#04070d;
    padding:11px 22px;border-radius:999px;font-weight:800;font-size:.86rem;
    box-shadow:0 16px 40px rgba(34,211,238,.35);opacity:0;transition:.35s;
    z-index:999;pointer-events:none;max-width:92vw;text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media(max-width:520px){
    .joystick{width:110px;height:110px}
    .joystick-knob{width:50px;height:50px;margin:-25px 0 0 -25px}
    .touch-buttons{bottom:150px}
    .touch-extract{bottom:280px;width:70px;height:70px}
    .hud-bottom{max-width:none;flex-direction:row;align-items:flex-end;gap:8px}
    .hp-bar{flex:1}
    .res-bar{font-size:.7rem;padding:5px 10px}
  }
</style>
</head>
<body>

<!-- ============ MENÜ ============ -->
<div id="menuScreen" class="screen on">
  <div class="logo">RIFTWELT</div>
  <div class="subtitle">3D Koop-Sandbox · Kein Max-Level</div>

  <div class="pick-title">Steuerung wählen</div>
  <div class="mode-grid">
    <button class="mode-btn" data-mode="kbm">
      <div class="mode-icon">⌨️🖱️</div>
      <div class="mode-title">Tastatur &amp; Maus</div>
      <div class="mode-desc">WASD · Maus zielen · Klick feuern · 1/2/3 Waffe</div>
    </button>
    <button class="mode-btn" data-mode="touch">
      <div class="mode-icon">📱</div>
      <div class="mode-title">Handy &amp; Tablet</div>
      <div class="mode-desc">Zwei Touch-Joysticks · Auto-Feuer beim Zielen</div>
    </button>
  </div>

  <button id="btnStart" class="start-btn" disabled>▶ Rift betreten</button>

  <div class="mini-stats">
    <span>Ruf <b id="mRuf">1</b></span>
    <span>Rang <b id="mRank">Holz</b></span>
    <span>Season <b id="mSeason">1</b></span>
    <span>Runs <b id="mRuns">0</b></span>
  </div>
</div>

<!-- ============ SPIEL ============ -->
<div id="gameScreen" class="screen">
  <canvas id="gameCanvas"></canvas>

  <div id="damageFlash"></div>
  <div id="crosshair"></div>

  <div id="hud">
    <div class="hud-top">
      <div class="hud-pill" id="hudKills">Kills 0 / 15</div>
      <div class="hud-pill" id="hudWeapon">Klinge</div>
      <div class="hud-pill" id="hudDanger">Gefahr 1.0×</div>
    </div>
    <button id="hudMenuBtn" title="Menü">☰</button>
    <div class="hud-bottom">
      <div class="hp-bar">
        <div class="hp-fill" id="hpFill"></div>
        <div class="hp-text" id="hpText">100 / 100</div>
      </div>
      <div class="res-bar">
        <span>✦ <b id="resEssence">0</b></span>
        <span>⚙️ <b id="resScrap">0</b></span>
        <span>💎 <b id="resCrystal">0</b></span>
      </div>
    </div>
  </div>

  <div id="touchControls">
    <div class="joystick left" id="moveStick">
      <div class="joystick-base"></div>
      <div class="joystick-knob"></div>
    </div>
    <div class="joystick right" id="aimStick">
      <div class="joystick-base"></div>
      <div class="joystick-knob"></div>
    </div>
    <div class="touch-buttons">
      <button class="touch-weapon active" data-weapon="blade">⚔️</button>
      <button class="touch-weapon" data-weapon="blaster">💥</button>
      <button class="touch-weapon" data-weapon="lance">🔱</button>
    </div>
    <button class="touch-extract" id="touchExtract" style="display:none">E<small>Extrakt</small></button>
  </div>

  <div class="pointer-hint" id="pointerHint" style="display:none">
    🖱️ Klicke ins Spielfeld, um die Maus zu greifen · ESC zum Freigeben
  </div>
</div>

<!-- ============ PANEL (Progression) ============ -->
<div id="panelScreen" class="screen overlay-screen">
  <div class="panel-inner">
    <div class="panel-header">
      <h2 id="panelTitle">🏗️ Siedlung</h2>
      <button id="panelClose" class="close-btn">✕</button>
    </div>
    <div class="panel-tabs">
      <button data-panel="settlement" class="on">🏗️ Siedlung</button>
      <button data-panel="mastery">🎯 Meisterschaft</button>
      <button data-panel="season">🌊 Season</button>
      <button data-panel="forge">🧩 Schmiede</button>
      <button data-panel="codex">📖 Kodex</button>
    </div>
    <div class="panel-content" id="panelContent"></div>
  </div>
</div>

<!-- ============ END-SCREEN ============ -->
<div id="endScreen" class="screen overlay-screen">
  <div class="end-inner">
    <h1 id="endTitle">Extraktion!</h1>
    <div id="endBody"></div>
    <div class="end-actions">
      <button id="endContinue" class="start-btn">▶ Weiter</button>
      <button id="endPanel" class="btn">☰ Progression</button>
      <button id="endMenu" class="btn">🏠 Menü</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ============================================================
   SAVE / STATE
   ============================================================ */
const SAVE_KEY = 'riftwelt3d_v1';
const DEFAULT = () => ({
  ruf: { xp:0, lvl:1 },
  res: { scrap:0, crystal:0, essence:0 },
  mastery: { blade:{xp:0,lvl:1}, blaster:{xp:0,lvl:1}, lance:{xp:0,lvl:1} },
  buildings: { workshop:0, defense:0, market:0, shrine:0, forge:0 },
  allies: [],
  season: { n:1, xp:0, lvl:1, prog:{ kills:0, runs:0, extractions:0 } },
  rank: { points:0 },
  codex: [],
  dungeons: [],
  stats: { runs:0, kills:0, extractions:0, deaths:0, essenceTotal:0 },
  activeWeapon: 'blade',
  controlMode: null
});
let S = (() => {
  try { const r = localStorage.getItem(SAVE_KEY); if(r) return Object.assign(DEFAULT(), JSON.parse(r)); } catch(e){}
  return DEFAULT();
})();
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }

/* ============================================================
   HELPERS
   ============================================================ */
const $ = id => document.getElementById(id);
const fmt = n => Math.floor(n).toLocaleString('de-DE');
const rufNeed = lvl => Math.floor(90 * Math.pow(lvl, 1.35));
const masteryNeed = lvl => Math.floor(40 * Math.pow(lvl, 1.25));
const seasonNeed = lvl => Math.floor(100 + (lvl-1) * 45);

function toast(msg){
  const t = $('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('on'), 2200);
}

/* ============================================================
   DATEN
   ============================================================ */
const WEAPONS = {
  blade:   { name:'Klinge',  color:0x22d3ee, dmg:22, cd:0.38, type:'melee',  range:3.6, cone:1.15 },
  blaster: { name:'Blaster', color:0xa78bfa, dmg:15, cd:0.20, type:'shot',   speed:34, radius:0.16 },
  lance:   { name:'Lanze',   color:0xfb923c, dmg:40, cd:0.75, type:'pierce', speed:26, radius:0.28 }
};
const BUILDINGS = {
  workshop: { name:'Werkstatt',    icon:'⚙️', desc:'+8% Schaden',            cost:l=>({scrap:40+l*35, crystal:l*6}) },
  defense:  { name:'Verteidigung', icon:'🛡️', desc:'+20 Max-LP',             cost:l=>({scrap:35+l*30, crystal:l*5}) },
  market:   { name:'Handelsplatz', icon:'💰', desc:'+12% Ressourcen',        cost:l=>({scrap:50+l*40, crystal:l*8}) },
  shrine:   { name:'Schrein',      icon:'🔮', desc:'+10% Meisterschaft-XP',  cost:l=>({scrap:60+l*45, crystal:l*10}) },
  forge:    { name:'Schmiede',     icon:'🔥', desc:'+5% Season-XP, +Mods',   cost:l=>({scrap:70+l*55, crystal:l*12}) }
};
const ALLIES = [
  { id:'kora', name:'Kora die Schmiedin', desc:'+12% Schaden',        cost:18 },
  { id:'vex',  name:'Vex der Späher',     desc:'+15% Tempo',          cost:14 },
  { id:'nula', name:'Nula die Händlerin', desc:'+15% Ressourcen',     cost:16 },
  { id:'bram', name:'Bram der Wächter',   desc:'+30 Max-LP',          cost:20 }
];
const RANKS = [
  { name:'Holz',min:0 },{ name:'Bronze',min:150 },{ name:'Silber',min:400 },
  { name:'Gold',min:800 },{ name:'Platin',min:1400 },{ name:'Diamant',min:2200 },
  { name:'Riftlord',min:3200 }
];
const CODEX = [
  { id:'drifter', name:'Drifter',   text:'Langsamer Verfolger.' },
  { id:'sprinter',name:'Sprinter',  text:'Schnell und fragil.' },
  { id:'brute',   name:'Bulle',     text:'Schwer und tödlich.' },
  { id:'shooter', name:'Schütze',   text:'Hält Abstand, feuert Bolzen.' },
  { id:'zone',    name:'Rift-Zone', text:'Ein Riss in der Welt.' },
  { id:'settle',  name:'Siedlung',  text:'Dein persistentes Projekt.' },
  { id:'guild',   name:'Gilde',     text:'Soziale Verankerung.' },
  { id:'season',  name:'Season',    text:'Saisonale Wellen.' },
  { id:'forge',   name:'Schmiede',  text:'Community-Inhalte.' },
  { id:'rank',    name:'Rangliste', text:'Skillbasierter Wettkampf.' }
];
const MODS = [
  { id:'horde',  name:'Dichte Horden',  text:'+60% Gegner' },
  { id:'glass',  name:'Glaskanone',     text:'2× Schaden rein/raus' },
  { id:'rain',   name:'Essenzregen',    text:'+60% Essenz' },
  { id:'swift',  name:'Zeitdruck',      text:'Gegner +35% Tempo' },
  { id:'brutes', name:'Bulleninvasion', text:'Mehr Bullen' },
  { id:'fog',    name:'Dichter Nebel',  text:'Sicht eingeschränkt' }
];

function rankTier(){ let t=RANKS[0]; for(const r of RANKS) if(S.rank.points>=r.min) t=r; return t; }

/* ============================================================
   PROGRESSION
   ============================================================ */
function addRuf(a){
  S.ruf.xp+=a;
  while(S.ruf.xp>=rufNeed(S.ruf.lvl)){ S.ruf.xp-=rufNeed(S.ruf.lvl); S.ruf.lvl++; toast(`⬆️ Ruf ${S.ruf.lvl}`); }
}
function addMastery(w,a){
  const m=S.mastery[w]; if(!m) return;
  m.xp += a * (1 + S.buildings.shrine*0.10);
  while(m.xp>=masteryNeed(m.lvl)){ m.xp-=masteryNeed(m.lvl); m.lvl++; toast(`🎯 ${WEAPONS[w].name} Stufe ${m.lvl}`); }
}
function addSeasonXp(a){
  S.season.xp += a * (1 + S.buildings.forge*0.05);
  while(S.season.xp>=seasonNeed(S.season.lvl)){ S.season.xp-=seasonNeed(S.season.lvl); S.season.lvl++; toast(`🌊 Season ${S.season.lvl}`); }
}
function addRes(type, amount){
  const mult = 1 + S.buildings.market*0.12 + (S.allies.includes('nula')?0.15:0);
  S.res[type] = (S.res[type]||0) + Math.floor(amount*mult);
}
function unlockCodex(id){ if(!S.codex.includes(id)){ S.codex.push(id); const e=CODEX.find(x=>x.id===id); if(e) toast(`📖 ${e.name}`); } }

let scene, camera, renderer, clock, playerMesh, dynamicGroup;
let G = null;
let isTouch = false;

  scene.background = new THREE.Color(0x04070c);
  scene.fog = new THREE.Fog(0x04070c, 45, 95);

  camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 200);
  camera.position.set(0, 10, 14);

  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const sun = new THREE.DirectionalLight(0xffffff, 1.1);
  sun.position.set(15, 25, 12);
  if(renderer.shadowMap.enabled){
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    sun.shadow.camera.left = -60; sun.shadow.camera.right = 60;
    sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -60;
  }
  scene.add(sun);
  const c1 = new THREE.PointLight(0x22d3ee, 60, 60); c1.position.set(25, 6, 25); scene.add(c1);
  const c2 = new THREE.PointLight(0xa78bfa, 60, 60); c2.position.set(-25, 6, -25); scene.add(c2);
  const c3 = new THREE.PointLight(0xfb923c, 40, 50); c3.position.set(25, 6, -25); scene.add(c3);

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(160, 160),
    new THREE.MeshStandardMaterial({color:0x0b1422, roughness:0.9, metalness:0.1})
  );
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  scene.add(ground);

  const grid = new THREE.GridHelper(120, 60, 0x22d3ee, 0x1a3040);
  grid.material.opacity = 0.15; grid.material.transparent = true;
  scene.add(grid);

  // Begrenzungswände
  const wallMat = new THREE.MeshStandardMaterial({
    color:0x22d3ee, emissive:0x22d3ee, emissiveIntensity:0.4,
    transparent:true, opacity:0.25
  });
  for(let i=0;i<4;i++){
    const wall = new THREE.Mesh(new THREE.BoxGeometry(120, 4, 0.3), wallMat);
    wall.position.y = 2;
    if(i===0) wall.position.z = -60;
    if(i===1) wall.position.z = 60;
    if(i===2){ wall.position.x = -60; wall.rotation.y = Math.PI/2; }
    if(i===3){ wall.position.x = 60; wall.rotation.y = Math.PI/2; }
    scene.add(wall);
  }

  // Spieler
  playerMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.7, 20, 20),
    new THREE.MeshStandardMaterial({color:0xe8eefb, emissive:0x22d3ee, emissiveIntensity:0.5, roughness:0.3})
  );
  playerMesh.castShadow = true;
  const nose = new THREE.Mesh(
    new THREE.ConeGeometry(0.25, 0.9, 8),
    new THREE.MeshStandardMaterial({color:0x22d3ee, emissive:0x22d3ee, emissiveIntensity:1})
  );
  nose.rotation.x = -Math.PI/2;
  nose.position.set(0, 0, -0.9);
  playerMesh.add(nose);
  scene.add(playerMesh);

  dynamicGroup = new THREE.Group();
  scene.add(dynamicGroup);

  clock = new THREE.Clock();
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if(G && G.mode === 'playing') updateGame(dt);
  if(renderer) renderer.render(scene, camera);
}

function clearDynamic(){
  while(dynamicGroup.children.length){
    const o = dynamicGroup.children[0];
    dynamicGroup.remove(o);
    o.traverse(c => { if(c.geometry) c.geometry.dispose(); if(c.material){ Array.isArray(c.material)?c.material.forEach(m=>m.dispose()):c.material.dispose(); } });
  }
}

/* ============================================================
   TOUCH-JOYSTICKS
   ============================================================ */
class Joystick {
  constructor(el, onChange){
    this.el = el;
    this.knob = el.querySelector('.joystick-knob');
    this.onChange = onChange;
    this.active = false; this.tid = null;
    this.cx = 0; this.cy = 0; this.radius = 60;
    el.addEventListener('pointerdown', e => this.start(e));
    el.addEventListener('pointermove', e => this.move(e));
    el.addEventListener('pointerup', e => this.end(e));
    el.addEventListener('pointercancel', e => this.end(e));
    el.addEventListener('pointerleave', e => { if(this.active && e.pointerId === this.tid) this.end(e); });
  }
  start(e){
    e.preventDefault();
    const r = this.el.getBoundingClientRect();
    this.cx = r.left + r.width/2;
    this.cy = r.top + r.height/2;
    this.radius = r.width/2;
    this.active = true; this.tid = e.pointerId;
    this.el.setPointerCapture(e.pointerId);
    this.move(e);
  }
  move(e){
    if(!this.active || e.pointerId !== this.tid) return;
    e.preventDefault();
    let dx = e.clientX - this.cx, dy = e.clientY - this.cy;
    const d = Math.hypot(dx, dy);
    if(d > this.radius){ dx = dx/d*this.radius; dy = dy/d*this.radius; }
    this.knob.style.transform = `translate(${dx}px,${dy}px)`;
    this.onChange({ x: dx/this.radius, y: dy/this.radius });
  }
  end(e){
    if(e.pointerId !== this.tid) return;
    this.active = false;
    this.knob.style.transform = 'translate(0,0)';
    this.onChange({ x:0, y:0 });
  }
}

let moveStick, aimStick;

   START / ENDE
   ============================================================ */
function startRun(mods=[], dungeonName='Rift-Zone'){
  clearDynamic();
  dynamicGroup.clear();

  const totalBuildings = Object.values(S.buildings).reduce((a,b)=>a+b,0);
  const maxHp = 100 + S.buildings.defense*20 + (S.allies.includes('bram')?30:0);

  G = {
    mode:'playing',
    mods, dungeonName,
    time:0,
    kills:0,
    target: 12 + S.season.n*2 + totalBuildings,
    danger: 1 + (S.season.n-1)*0.18 + totalBuildings*0.03,
    spawnTimer: 1,
    camState: { yaw:0, pitch:0.55 },
    player: {
      pos: new THREE.Vector3(0, 0.7, 0),
      hp: maxHp, maxHp,
      speed: 9 * (S.allies.includes('vex')?1.15:1),
      cd: 0, invuln: 0
    },
    enemies: [],
    bullets: [],
    enemyBullets: [],
    pickups: [],
    portal: null,
    essence: 0, scrap: 0, crystal: 0
  };
  if(mods.includes('horde')) G.target = Math.round(G.target * 1.6);

  // Startressourcen
  for(let i=0;i<6;i++) spawnResourceNode();
  // Startgegner
  for(let i=0;i<3;i++) spawnEnemy();

  playerMesh.position.copy(G.player.pos);
  playerMesh.rotation.y = 0;

  updateCamera(1, true);
  updateHUD();
  showScreen('game');

  if(isTouch){
    $('touchControls').classList.add('on');
    $('pointerHint').style.display = 'none';
    $('crosshair').classList.remove('on');
  } else {
    $('touchControls').classList.remove('on');
    $('pointerHint').style.display = 'block';
    $('crosshair').classList.remove('on');
  }

  S.stats.runs++;
  S.season.prog.runs = (S.season.prog.runs||0) + 1;
  unlockCodex('zone');
  save();
}

function tryExtract(){
  if(!G || G.mode !== 'playing' || !G.portal) return;
  if(G.player.pos.distanceTo(G.portal.mesh.position) < 3.5){
    endRun(true);
  } else {
    toast('Portal noch nicht erreicht.');
  }
}

function endRun(success){
  G.mode = 'ended';
  document.exitPointerLock?.();

  const ess = Math.floor(G.essence * (G.mods.includes('rain')?1.6:1));
  const scr = Math.floor(G.scrap);
  const cry = Math.floor(G.crystal);

  let body = '';
  let title = '';

  if(success){
    title = '✦ Extraktion erfolgreich!';
    addRes('essence', ess);
    addRes('scrap', scr);
    addRes('crystal', cry);
    S.stats.extractions++;
    S.season.prog.extractions = (S.season.prog.extractions||0)+1;
    S.rank.points += 25 + Math.floor(G.kills*1.2);
    addRuf(Math.floor(60 + G.kills*8));
    addMastery(S.activeWeapon, Math.floor(30 + G.kills*7));
    addSeasonXp(Math.floor(G.kills*4 + ess*0.3));
    S.stats.essenceTotal += ess;
    unlockCodex('rank');
    body = `
      Du hast <strong>${fmt(ess)}</strong> Essenz, <strong>${fmt(scr)}</strong> Schrott
      und <strong>${fmt(cry)}</strong> Kristall gesichert.<br><br>
      +${25+Math.floor(G.kills*1.2)} Rangpunkte · +${Math.floor(G.kills*4+ess*0.3)} Season-XP
    `;
  } else {
    title = '💀 Rift zusammengebrochen';
    addRes('essence', Math.floor(ess*0.6));
    addRes('scrap', Math.floor(scr*0.6));
    S.stats.deaths++;
    S.rank.points = Math.max(0, S.rank.points - 12);
    addRuf(Math.floor(20 + G.kills*3));
    body = `
      Du hast <strong>${fmt(Math.floor(ess*0.6))}</strong> Essenz gerettet (40% verloren).<br>
      -12 Rangpunkte. <strong>Meisterschaft, Siedlung und Ruf bleiben.</strong>
    `;
  }

  save();
  updateHUD();
  $('endTitle').textContent = title;
  $('endBody').innerHTML = body;
  showScreen('end');
  $('touchExtract').style.display = 'none';
}

/* ============================================================
   KAMERA
   ============================================================ */
function updateCamera(dt, snap=false){
  if(!G) return;
  const cs = G.camState;
  const dist = 13;
  const cp = Math.cos(cs.pitch), sp = Math.sin(cs.pitch);
  const target = new THREE.Vector3(G.player.pos.x, G.player.pos.y + 1.2, G.player.pos.z);
  const desired = new THREE.Vector3(
    target.x + Math.sin(cs.yaw) * cp * dist,
    target.y + sp * dist,
    target.z + Math.cos(cs.yaw) * cp * dist
  );
  if(snap) camera.position.copy(desired);
  else camera.position.lerp(desired, 1 - Math.pow(0.001, dt));
  camera.lookAt(target);
}

   SPAWNING
   ============================================================ */
function spawnResourceNode(){
  const type = Math.random() < 0.75 ? 'scrap' : 'crystal';
  const color = type === 'scrap' ? 0xfb923c : 0xa78bfa;
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(0.6, 0.6, 0.6),
    new THREE.MeshStandardMaterial({color, emissive:color, emissiveIntensity:0.8})
  );
  const angle = Math.random()*Math.PI*2;
  const radius = 8 + Math.random()*40;
  mesh.position.set(Math.cos(angle)*radius, 0.5, Math.sin(angle)*radius);
  dynamicGroup.add(mesh);
  G.pickups.push({mesh, type, amount: type==='crystal'?2:6, r:0.5});
}

function spawnEnemy(){
  const roll = Math.random();
  let type = 'drifter';
  if(roll > 0.82) type = 'brute';
  else if(roll > 0.62) type = 'shooter';
  else if(roll > 0.35) type = 'sprinter';
  if(G.mods.includes('brutes') && Math.random() < 0.35) type = 'brute';

  const cfg = {
    drifter:  {hp:34,  speed:3.2, r:0.55, dmg:8,  color:0x22d3ee, geo:()=>new THREE.BoxGeometry(1.1,1.1,1.1)},
    sprinter: {hp:22,  speed:6.2, r:0.45, dmg:6,  color:0xfb923c, geo:()=>new THREE.TetrahedronGeometry(0.9)},
    brute:    {hp:110, speed:2.2, r:1.05, dmg:18, color:0xf87171, geo:()=>new THREE.BoxGeometry(2,2,2)},
    shooter:  {hp:30,  speed:3,   r:0.55, dmg:0,  color:0xa78bfa, geo:()=>new THREE.OctahedronGeometry(0.8)}
  }[type];

  const mesh = new THREE.Mesh(
    cfg.geo(),
    new THREE.MeshStandardMaterial({color:cfg.color, emissive:cfg.color, emissiveIntensity:0.55, roughness:0.5})
  );
  if(renderer.shadowMap.enabled) mesh.castShadow = true;

  const angle = Math.random()*Math.PI*2;
  const radius = 50;
  const pos = new THREE.Vector3(Math.cos(angle)*radius, cfg.r, Math.sin(angle)*radius);
  mesh.position.copy(pos);
  dynamicGroup.add(mesh);

  const speedMul = G.mods.includes('swift') ? 1.35 : 1;
  const hp = cfg.hp * G.danger;

  G.enemies.push({
    mesh, pos, type,
    hp, maxHp: hp,
    speed: cfg.speed * speedMul * (0.9+Math.random()*0.2),
    r: cfg.r, dmg: cfg.dmg,
    color: cfg.color,
    shootCd: 1.5 + Math.random()*2,
    hitCd: 0,
    flash: 0
  });
  unlockCodex(type);
}

function spawnEnemyBullet(e){
  const dir = new THREE.Vector3().subVectors(G.player.pos, e.pos).normalize();
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.25, 8, 8),
    new THREE.MeshStandardMaterial({color:0xf87171, emissive:0xf87171, emissiveIntensity:1})
  );
  mesh.position.copy(e.pos); mesh.position.y = 1;
  dynamicGroup.add(mesh);
  G.enemyBullets.push({
    mesh, pos: mesh.position.clone(),
    vel: dir.multiplyScalar(14),
    dmg: 8 * G.danger,
    life: 4
  });
}

/* ============================================================
   KAMPF
   ============================================================ */
function getAimDir(){
  return new THREE.Vector3(-Math.sin(G.camState.yaw), 0, -Math.cos(G.camState.yaw));
}
function getRightDir(){
  return new THREE.Vector3(Math.cos(G.camState.yaw), 0, -Math.sin(G.camState.yaw));
}

function setWeapon(id){
  S.activeWeapon = id; save();
  document.querySelectorAll('.touch-weapon').forEach(b=>b.classList.toggle('active', b.dataset.weapon===id));
  updateHUD();
}

function fire(){
  const w = WEAPONS[S.activeWeapon];
  const m = S.mastery[S.activeWeapon];
  const baseDmg = w.dmg * (1 + (m.lvl-1)*0.05) * (1 + S.buildings.workshop*0.08)
                * (S.allies.includes('kora')?1.12:1);
  const dmg = G.mods.includes('glass') ? baseDmg*1.35 : baseDmg;

  G.player.cd = w.cd;
  const aim = getAimDir();

  if(w.type === 'melee'){
    for(let i=G.enemies.length-1; i>=0; i--){
      const e = G.enemies[i];
      const to = new THREE.Vector3().subVectors(e.pos, G.player.pos);
      const d = to.length();
      if(d > w.range + e.r) continue;
      to.y = 0; to.normalize();
      if(to.dot(aim) < Math.cos(w.cone)) continue;
      damageEnemy(i, dmg);
    }
    // Hieb-Feedback
    for(let i=0;i<8;i++){
      const a = G.camState.yaw + Math.PI + (Math.random()-0.5)*1.4;
      const p = new THREE.Mesh(
        new THREE.SphereGeometry(0.1, 6, 6),
        new THREE.MeshStandardMaterial({color:w.color, emissive:w.color, emissiveIntensity:1})
      );
      p.position.copy(G.player.pos).add(new THREE.Vector3(Math.sin(a)*2, 0.3, Math.cos(a)*2));
      dynamicGroup.add(p);
      setTimeout(()=>{ if(p.parent) p.parent.remove(p); p.geometry.dispose(); p.material.dispose(); }, 150);
    }
  } else {
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(w.radius, 8, 8),
      new THREE.MeshStandardMaterial({color:w.color, emissive:w.color, emissiveIntensity:1})
    );
    mesh.position.copy(G.player.pos);
    mesh.position.y = 1;
    dynamicGroup.add(mesh);
    G.bullets.push({
      mesh,
      pos: mesh.position.clone(),
      vel: aim.clone().multiplyScalar(w.speed),
      dmg,
      pierce: w.type === 'pierce',
      life: 2.5,
      r: w.radius
    });
  }
}

function damageEnemy(idx, dmg){
  const e = G.enemies[idx];
  if(!e) return;
  e.hp -= dmg;
  e.flash = 0.15;
  e.mesh.material.emissiveIntensity = 3;
  if(e.hp <= 0) killEnemy(idx);
}

function killEnemy(idx){
  const e = G.enemies[idx];
  if(!e) return;
  G.kills++; S.stats.kills++;
  S.season.prog.kills = (S.season.prog.kills||0)+1;

  // Essenz
  const essenceMesh = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.32),
    new THREE.MeshStandardMaterial({color:0x22d3ee, emissive:0x22d3ee, emissiveIntensity:1})
  );
  essenceMesh.position.copy(e.pos);
  essenceMesh.position.y = 0.6;
  dynamicGroup.add(essenceMesh);
  G.pickups.push({mesh:essenceMesh, type:'essence', amount: 2 + Math.floor(G.danger), r:0.6});

  // Chance auf Ressource
  if(Math.random() < 0.3){
    const type = Math.random() < 0.3 ? 'crystal' : 'scrap';
    const color = type === 'crystal' ? 0xa78bfa : 0xfb923c;
    const rm = new THREE.Mesh(
      new THREE.BoxGeometry(0.5,0.5,0.5),
      new THREE.MeshStandardMaterial({color, emissive:color, emissiveIntensity:0.9})
    );
    rm.position.copy(e.pos);
    rm.position.y = 0.6;
    dynamicGroup.add(rm);
    G.pickups.push({mesh:rm, type, amount: type==='crystal'?2:6, r:0.6});
  }

  e.mesh.parent && e.mesh.parent.remove(e.mesh);
  e.mesh.geometry.dispose(); e.mesh.material.dispose();
  G.enemies.splice(idx, 1);

  addMastery(S.activeWeapon, 8);
  updateHUD();
  checkPortal();
}

function damagePlayer(amount){
  if(!G || G.player.invuln > 0) return;
  const mult = G.mods.includes('glass') ? 2 : 1;
  G.player.hp -= amount * mult;
  G.player.invuln = 0.35;
  const flash = $('damageFlash');
  flash.style.opacity = '1';
  setTimeout(()=> flash.style.opacity = '0', 120);
  playerMesh.material.emissiveIntensity = 2;
  setTimeout(()=>{ if(playerMesh) playerMesh.material.emissiveIntensity = 0.5; }, 120);
  updateHUD();
  if(G.player.hp <= 0){ G.player.hp = 0; endRun(false); }
}

/* ============================================================
   PORTAL
   ============================================================ */
function checkPortal(){
  if(G.portal || G.kills < G.target) return;
  const mesh = new THREE.Mesh(
    new THREE.TorusGeometry(2.2, 0.28, 12, 32),
    new THREE.MeshStandardMaterial({color:0x22d3ee, emissive:0x22d3ee, emissiveIntensity:1.5})
  );
  mesh.position.set(0, 1.8, 0);
  mesh.rotation.x = Math.PI/2;
  dynamicGroup.add(mesh);

  const inner = new THREE.Mesh(
    new THREE.CircleGeometry(1.8, 32),
    new THREE.MeshBasicMaterial({color:0x22d3ee, transparent:true, opacity:0.25, side:THREE.DoubleSide})
  );
  inner.rotation.x = -Math.PI/2;
  inner.position.y = 0.05;
  inner.position.set(0, 0.05, 0);
  dynamicGroup.add(inner);

  G.portal = { mesh };
  toast('✦ Portal geöffnet – begib dich zur Mitte!');
  if(isTouch) $('touchExtract').style.display = 'block';
}

/* ============================================================
   GAME UPDATE
   ============================================================ */
function updateGame(dt){
  if(!G || G.mode !== 'playing') return;
  G.time += dt;

  // Bewegung
  let ix = 0, iy = 0;
  if(S.controlMode === 'kbm'){
    if(keys['w']||keys['arrowup'])    iy -= 1;
    if(keys['s']||keys['arrowdown'])  iy += 1;
    if(keys['a']||keys['arrowleft'])  ix -= 1;
    if(keys['d']||keys['arrowright']) ix += 1;
  } else {
    ix = moveInput.x; iy = moveInput.y;
  }

  // Touch: rechter Stick rotiert Kamera + Auto-Feuer
  if(isTouch){
    const aimMag = Math.hypot(aimInput.x, aimInput.y);
    if(aimMag > 0.15){
      G.camState.yaw   += aimInput.x * dt * 2.8;
      G.camState.pitch  = Math.max(0.05, Math.min(1.3, G.camState.pitch + aimInput.y * dt * 1.6));
    }
    if(aimMag > 0.35) firing = true;
    else firing = false;
  }

  const aim = getAimDir();
  const right = getRightDir();
  const move = new THREE.Vector3();
  move.addScaledVector(aim, -iy);
  move.addScaledVector(right, ix);
  if(move.lengthSq() > 0){
    move.normalize();
    G.player.pos.addScaledVector(move, G.player.speed * dt);
    G.player.pos.x = Math.max(-58, Math.min(58, G.player.pos.x));
    G.player.pos.z = Math.max(-58, Math.min(58, G.player.pos.z));
  }
  playerMesh.position.copy(G.player.pos);
  playerMesh.rotation.y = G.camState.yaw;

  // Schießen
  G.player.cd -= dt;
  G.player.invuln = Math.max(0, G.player.invuln - dt);
  if(firing && G.player.cd <= 0) fire();

  // Gegner
  for(let i=G.enemies.length-1; i>=0; i--){
    const e = G.enemies[i];
    const toPlayer = new THREE.Vector3().subVectors(G.player.pos, e.pos);
    toPlayer.y = 0;
    const dist = toPlayer.length();
    toPlayer.normalize();

    let mdir = toPlayer.clone();
    if(e.type === 'shooter'){
      if(dist < 9) mdir = toPlayer.clone().multiplyScalar(-1);
      else if(dist < 16) mdir = new THREE.Vector3();
      e.shootCd -= dt;
      if(e.shootCd <= 0 && dist < 32){ e.shootCd = 2; spawnEnemyBullet(e); }
    }
    e.pos.addScaledVector(mdir, e.speed * dt);
    e.pos.x = Math.max(-58, Math.min(58, e.pos.x));
    e.pos.z = Math.max(-58, Math.min(58, e.pos.z));
    e.mesh.position.copy(e.pos);

    // Flash
    if(e.flash > 0){
      e.flash -= dt;
      e.mesh.material.emissiveIntensity = Math.max(0.55, 3 * (e.flash/0.15));
    }

    // Kontaktschaden
    e.hitCd -= dt;
    if(e.dmg > 0 && dist < e.r + 0.7 && e.hitCd <= 0){
      e.hitCd = 0.8;
      damagePlayer(e.dmg);
    }
  }

  // Spielerkugeln
  for(let i=G.bullets.length-1; i>=0; i--){
    const b = G.bullets[i];
    b.pos.addScaledVector(b.vel, dt);
    b.life -= dt;
    b.mesh.position.copy(b.pos);
    if(b.life <= 0 || b.pos.length() > 120){
      b.mesh.parent && b.mesh.parent.remove(b.mesh);
      b.mesh.geometry.dispose(); b.mesh.material.dispose();
      G.bullets.splice(i,1); continue;
    }
    for(let j=G.enemies.length-1; j>=0; j--){
      const e = G.enemies[j];
      if(b.pos.distanceTo(e.pos) < e.r + b.r){
        damageEnemy(j, b.dmg);
        if(!b.pierce){
          b.mesh.parent && b.mesh.parent.remove(b.mesh);
          b.mesh.geometry.dispose(); b.mesh.material.dispose();
          G.bullets.splice(i,1);
        }
        break;
      }
    }
  }

  // Gegnerkugeln
  for(let i=G.enemyBullets.length-1; i>=0; i--){
    const b = G.enemyBullets[i];
    b.pos.addScaledVector(b.vel, dt);
    b.life -= dt;
    b.mesh.position.copy(b.pos);
    if(b.life <= 0){
      b.mesh.parent && b.mesh.parent.remove(b.mesh);
      b.mesh.geometry.dispose(); b.mesh.material.dispose();
      G.enemyBullets.splice(i,1); continue;
    }
    if(b.pos.distanceTo(G.player.pos) < 1){
      damagePlayer(b.dmg);
      b.mesh.parent && b.mesh.parent.remove(b.mesh);
      b.mesh.geometry.dispose(); b.mesh.material.dispose();
      G.enemyBullets.splice(i,1);
    }
  }

  // Pickups
  for(let i=G.pickups.length-1; i>=0; i--){
    const p = G.pickups[i];
    p.mesh.rotation.y += dt * 2;
    p.mesh.position.y = 0.6 + Math.sin(G.time*3 + i) * 0.15;
    const d = p.mesh.position.distanceTo(G.player.pos);
    if(d < 2.5 && d > 0.01){
      const pull = new THREE.Vector3().subVectors(G.player.pos, p.mesh.position).normalize();
      p.mesh.position.addScaledVector(pull, 6 * dt);
    }
    if(d < 1.1){
      if(p.type==='essence') G.essence += p.amount;
      else if(p.type==='scrap') G.scrap += p.amount;
      else if(p.type==='crystal') G.crystal += p.amount;
      p.mesh.parent && p.mesh.parent.remove(p.mesh);
      p.mesh.geometry.dispose(); p.mesh.material.dispose();
      G.pickups.splice(i,1);
      updateHUD();
    }
  }

  // Spawning
  if(!G.portal && G.kills < G.target){
    G.spawnTimer -= dt;
    const interval = (G.mods.includes('horde') ? 0.55 : 1.0) / (1 + G.danger*0.2);
    if(G.spawnTimer <= 0 && G.enemies.length < 22){
      G.spawnTimer = interval;
      spawnEnemy();
      if(G.mods.includes('horde') && Math.random() < 0.5) spawnEnemy();
    }
  }

  // Portal
  if(G.portal){
    G.portal.mesh.rotation.z += dt * 1.5;
    if(G.player.pos.distanceTo(G.portal.mesh.position) < 2.8){
      endRun(true);
    }
  }

  updateCamera(dt);
  updateHUD();
}

/* ============================================================
   HUD
   ============================================================ */
function updateHUD(){
  if(!G) return;
  const p = G.player;
  const pct = Math.max(0, p.hp / p.maxHp * 100);
  $('hpFill').style.width = pct + '%';
  $('hpFill').style.background = pct > 55
    ? 'linear-gradient(90deg,#34d399,#22d3ee)'
    : pct > 25
      ? 'linear-gradient(90deg,#fb923c,#fbbf24)'
      : 'linear-gradient(90deg,#ef4444,#f87171)';
  $('hpText').textContent = `${Math.ceil(p.hp)} / ${Math.ceil(p.maxHp)}`;
  $('hudKills').textContent = `Kills ${G.kills} / ${G.target}`;
  $('hudWeapon').textContent = WEAPONS[S.activeWeapon].name;
  $('hudDanger').textContent = `Gefahr ${G.danger.toFixed(1)}×`;
  $('resEssence').textContent = G.essence;
  $('resScrap').textContent = G.scrap;
  $('resCrystal').textContent = G.crystal;
}

/* ============================================================
   SCREEN SWITCH
   ============================================================ */
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  $(name + 'Screen').classList.add('on');
  if(name === 'menu') refreshMenu();
}

function refreshMenu(){
  $('mRuf').textContent = S.ruf.lvl;
  $('mRank').textContent = rankTier().name;
  $('mSeason').textContent = S.season.n;
  $('mRuns').textContent = S.stats.runs;
}

/* ============================================================
   PANELS
   ============================================================ */
function openPanel(name){
  $('panelScreen').classList.add('on');
  document.querySelectorAll('.panel-tabs button').forEach(b => {
    b.classList.toggle('on', b.dataset.panel === name);
  });
  renderPanel(name);
}

$('panelClose').addEventListener('click', () => {
  $('panelScreen').classList.remove('on');
});
document.querySelectorAll('.panel-tabs button').forEach(b => {
  b.addEventListener('click', () => openPanel(b.dataset.panel));
});
$('hudMenuBtn').addEventListener('click', () => {
  if(G && G.mode === 'playing'){
    G.mode = 'paused';
    document.exitPointerLock?.();
  }
  openPanel('settlement');
});

function renderPanel(name){
  $('panelTitle').textContent = {
    settlement:'🏗️ Siedlung', mastery:'🎯 Meisterschaft', season:'🌊 Season',
    forge:'🧩 Schmiede', codex:'📖 Kodex'
  }[name];
  const c = $('panelContent');
  c.innerHTML = '';

  if(name === 'settlement') renderSettlement(c);
  else if(name === 'mastery') renderMastery(c);
  else if(name === 'season') renderSeason(c);
  else if(name === 'forge') renderForge(c);
  else if(name === 'codex') renderCodex(c);
}

function renderSettlement(c){
  for(const key in BUILDINGS){
    const b = BUILDINGS[key];
    const lvl = S.buildings[key];
    const cost = b.cost(lvl);
    const can = S.res.scrap >= cost.scrap && S.res.crystal >= (cost.crystal||0);
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div style="font-size:1.5rem">${b.icon}</div>
      <div class="grow">
        <div class="name">${b.name} <span class="tag gold">St. ${lvl}</span></div>
        <div class="desc">${b.desc} · ${fmt(cost.scrap)}⚙️${cost.crystal?' '+fmt(cost.crystal)+'💎':''}</div>
      </div>
      <button class="btn sm ${can?'pri':''}" ${can?'':'disabled'} data-build="${key}">Ausbau</button>`;
    c.appendChild(row);
  }
  c.querySelectorAll('[data-build]').forEach(btn => {
    btn.addEventListener('click', () => buildUp(btn.dataset.build));
  });

  const gl = document.createElement('div');
  gl.innerHTML = `<div class="name" style="margin:14px 0 6px;color:#22d3ee">🤝 Gilden-Verbündete</div>`;
  c.appendChild(gl);

  ALLIES.forEach(a => {
    const owned = S.allies.includes(a.id);
    const can = S.res.crystal >= a.cost;
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div class="grow">
        <div class="name">${a.name} ${owned?'<span class="tag on">Aktiv</span>':''}</div>
        <div class="desc">${a.desc} · ${a.cost}💎</div>
      </div>
      ${owned?'':`<button class="btn sm ${can?'pri':''}" ${can?'':'disabled'} data-ally="${a.id}">Rekrutieren</button>`}`;
    c.appendChild(row);
  });
  c.querySelectorAll('[data-ally]').forEach(btn => {
    btn.addEventListener('click', () => {
      const a = ALLIES.find(x => x.id === btn.dataset.ally);
      if(!a || S.allies.includes(a.id) || S.res.crystal < a.cost) return;
      S.res.crystal -= a.cost;
      S.allies.push(a.id);
      unlockCodex('guild');
      save(); renderPanel('settlement'); toast(`🤝 ${a.name} beigetreten!`);
    });
  });
}

function buildUp(key){
  const b = BUILDINGS[key];
  const cost = b.cost(S.buildings[key]);
  if(S.res.scrap < cost.scrap || S.res.crystal < (cost.crystal||0)) return;
  S.res.scrap -= cost.scrap;
  S.res.crystal -= (cost.crystal||0);
  S.buildings[key]++;
  unlockCodex('settle');
  save(); renderPanel('settlement');
  toast(`${b.icon} ${b.name} Stufe ${S.buildings[key]}`);
}

function renderMastery(c){
  for(const id in WEAPONS){
    const w = WEAPONS[id];
    const m = S.mastery[id];
    const need = masteryNeed(m.lvl);
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div class="grow">
        <div class="name" style="color:#${w.color.toString(16).padStart(6,'0')}">${w.name}</div>
        <div class="desc">Stufe ${m.lvl} · +${Math.round((m.lvl-1)*5)}% Schaden</div>
        <div class="bar"><i style="width:${Math.min(100, m.xp/need*100)}%"></i></div>
        <div class="desc" style="margin-top:4px">${fmt(m.xp)} / ${fmt(need)} XP</div>
      </div>`;
    c.appendChild(row);
  }
  const need = rufNeed(S.ruf.lvl);
  const r = document.createElement('div');
  r.style.marginTop = '14px';
  r.innerHTML = `
    <div class="name" style="color:#22d3ee">Grenzgänger-Ruf Level ${S.ruf.lvl}</div>
    <div class="bar"><i style="width:${Math.min(100,S.ruf.xp/need*100)}%"></i></div>
    <div class="desc" style="margin-top:4px">${fmt(S.ruf.xp)} / ${fmt(need)} XP · Rang: ${rankTier().name}</div>`;
  c.appendChild(r);
}

function renderSeason(c){
  const need = seasonNeed(S.season.lvl);
  const r = document.createElement('div');
  r.innerHTML = `
    <div class="name" style="color:#a78bfa">Season ${S.season.n} · Level ${S.season.lvl}</div>
    <div class="bar"><i style="width:${Math.min(100,S.season.xp/need*100)}%"></i></div>
    <div class="desc" style="margin-top:4px">${fmt(S.season.xp)} / ${fmt(need)} Season-XP</div>`;
  c.appendChild(r);

  const objectives = [
    { key:'kills',       label:'Gegner besiegen',       target:15+S.season.n*8 },
    { key:'runs',        label:'Rift-Zonen betreten',    target:3+S.season.n },
    { key:'extractions', label:'Erfolgreich extrahieren',target:2+S.season.n }
  ];
  objectives.forEach(o => {
    const cur = Math.min(o.target, S.season.prog[o.key]||0);
    const done = cur >= o.target;
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div class="grow">
        <div class="name">${o.label} ${done?'<span class="tag on">Erfüllt</span>':''}</div>
        <div class="bar"><i style="width:${cur/o.target*100}%"></i></div>
        <div class="desc">${cur} / ${o.target}</div>
      </div>`;
    c.appendChild(row);
  });

  const btn = document.createElement('button');
  btn.className = 'btn pri'; btn.style.marginTop = '12px';
  btn.textContent = '🌊 Nächste Season auslösen';
  btn.addEventListener('click', () => {
    if(!confirm('Nächste Season? Season-Level & Ziele reset, Rang -20%. Meisterschaft, Siedlung, Ruf bleiben.')) return;
    S.season.n++; S.season.xp = 0; S.season.lvl = 1;
    S.season.prog = { kills:0, runs:0, extractions:0 };
    S.rank.points = Math.floor(S.rank.points * 0.8);
    addRes('crystal', 20); addRes('scrap', 150);
    unlockCodex('season'); save();
    renderPanel('season'); toast(`🌊 Season ${S.season.n} beginnt!`);
  });
  c.appendChild(btn);
}

function renderForge(c){
  const slots = 2 + S.buildings.forge;
  const info = document.createElement('div');
  info.innerHTML = `<div class="desc">Mods max: <b style="color:#22d3ee">${slots}</b></div>`;
  c.appendChild(info);

  const nameInput = document.createElement('input');
  nameInput.type = 'text'; nameInput.placeholder = 'Dungeon-Name';
  nameInput.maxLength = 28;
  nameInput.style.cssText = 'width:100%;padding:10px 14px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);color:#e8eefb;font:inherit;font-size:.86rem;outline:none;margin-top:8px';
  c.appendChild(nameInput);

  const modWrap = document.createElement('div');
  modWrap.style.marginTop = '10px';
  MODS.forEach(m => {
    const lbl = document.createElement('label');
    lbl.style.cssText = 'display:flex;gap:9px;align-items:flex-start;font-size:.84rem;padding:6px 0;color:#93a2bb;cursor:pointer';
    lbl.innerHTML = `<input type="checkbox" value="${m.id}" style="margin-top:3px;accent-color:#22d3ee"><span><strong style="color:#e8eefb">${m.name}</strong> – ${m.text}</span>`;
    modWrap.appendChild(lbl);
  });
  c.appendChild(modWrap);

  const createBtn = document.createElement('button');
  createBtn.className = 'btn pri'; createBtn.style.marginTop = '12px';
  createBtn.textContent = '✦ Dungeon erstellen';
  createBtn.addEventListener('click', () => {
    const name = nameInput.value.trim() || 'Unbenannter Dungeon';
    const checked = Array.from(modWrap.querySelectorAll('input:checked')).map(x=>x.value);
    if(checked.length > slots){ toast(`Max ${slots} Mods`); return; }
    const code = 'RW-' + Math.random().toString(36).slice(2,6).toUpperCase();
    S.dungeons.push({ name, mods: checked, code });
    unlockCodex('forge'); save();
    renderPanel('forge'); toast(`🧩 ${code}`);
  });
  c.appendChild(createBtn);

  if(S.dungeons.length){
    const h = document.createElement('div');
    h.innerHTML = `<div class="name" style="margin:16px 0 6px;color:#22d3ee">Eigene Dungeons</div>`;
    c.appendChild(h);
    S.dungeons.forEach(d => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `
        <div class="grow">
          <div class="name">${d.name} <code style="font-size:.7rem;color:#22d3ee">${d.code}</code></div>
          <div class="desc">${d.mods.map(m => MODS.find(x=>x.id===m)?.name).join(' · ') || 'Keine Mods'}</div>
        </div>
        <button class="btn sm pri" data-play="${d.code}">▶ Starten</button>`;
      c.appendChild(row);
      row.querySelector('[data-play]').addEventListener('click', () => {
        $('panelScreen').classList.remove('on');
        startRun(d.mods, d.name);
      });
    });
  }
}

function renderCodex(c){
  CODEX.forEach(e => {
    const found = S.codex.includes(e.id);
    const row = document.createElement('div');
    row.className = 'row';
    row.style.opacity = found ? '1' : '.45';
    row.innerHTML = `
      <div style="font-size:1.2rem">${found?'📖':'🔒'}</div>
      <div class="grow">
        <div class="name">${e.name}</div>
        <div class="desc">${found ? e.text : 'Noch nicht entdeckt.'}</div>
      </div>`;
    c.appendChild(row);
  });
  const st = document.createElement('div');
  st.style.marginTop = '14px';
  st.innerHTML = `
    <div class="desc">Runs: <b style="color:#22d3ee">${fmt(S.stats.runs)}</b> · Kills: <b style="color:#22d3ee">${fmt(S.stats.kills)}</b></div>
    <div class="desc">Extraktionen: <b style="color:#34d399">${fmt(S.stats.extractions)}</b> · Niederlagen: <b style="color:#f87171">${fmt(S.stats.deaths)}</b></div>
    <div class="desc">Essenz gesamt: <b style="color:#22d3ee">${fmt(S.stats.essenceTotal)}</b> · Rang: <b style="color:#22d3ee">${rankTier().name} (${fmt(S.rank.points)} RP)</b></div>`;
  c.appendChild(st);
}

/* ============================================================
   BUTTONS
   ============================================================ */
let selectedMode = null;
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    selectedMode = btn.dataset.mode;
    S.controlMode = selectedMode; save();
    $('btnStart').disabled = false;
  });
});

$('btnStart').addEventListener('click', () => {
  if(!selectedMode) return;
  isTouch = selectedMode === 'touch';

  if(!scene){ initThree(); }

  if(isTouch){ initTouchControls(); }
  else {
    $('touchControls').classList.remove('on');
  }

  startRun();
});

$('endContinue').addEventListener('click', () => {
  startRun();
});
$('endPanel').addEventListener('click', () => {
  openPanel('settlement');
});
$('endMenu').addEventListener('click', () => {
  G = null;
  showScreen('menu');
});

/* ============================================================
   INIT
   ============================================================ */
refreshMenu();
// Controls vorauswählen, falls bereits gespeichert
if(S.controlMode){
  const b = document.querySelector(`.mode-btn[data-mode="${S.controlMode}"]`);
  if(b){ b.click(); }
}
</script>
