<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XENOGENESIS — Alien Evolution</title>
<style>
  :root{
    --bg:#05060d;
    --panel:rgba(10,14,28,0.72);
    --panel-2:rgba(16,22,44,0.82);
    --border:rgba(120,160,255,0.22);
    --accent:#7df9ff;
    --accent2:#c084fc;
    --good:#4ade80;
    --bad:#f87171;
    --warn:#fbbf24;
    --text:#dbe4ff;
    --dim:#7f8bb5;
    --glow:#7df9ff;
  }
  body[data-stage="bacteria"]{ --glow:#4ade80; --accent:#6ee7b7; }
  body[data-stage="colony"]  { --glow:#c084fc; --accent:#c084fc; }
  body[data-stage="aquatic"] { --glow:#38bdf8; --accent:#38bdf8; }
  body[data-stage="choice"]  { --glow:#fbbf24; --accent:#fbbf24; }
  body[data-stage="land"]    { --glow:#fb923c; --accent:#fb923c; }
  body[data-stage="fish"]    { --glow:#22d3ee; --accent:#22d3ee; }
  body[data-stage="win"]     { --glow:#a3e635; --accent:#a3e635; }
  body[data-stage="dead"]    { --glow:#ef4444; --accent:#ef4444; }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background: radial-gradient(circle at 50% 10%, #0b1230 0%, #05060d 55%, #02030a 100%);
    color:var(--text);
    font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace;
    min-height:100vh;
    overflow-x:hidden;
  }
  #bg{ position:fixed; inset:0; z-index:0; pointer-events:none; }

  #app{
    position:relative; z-index:1;
    max-width: 880px;
    margin: 0 auto;
    padding: 28px 18px 60px;
    display:flex; flex-direction:column; gap:16px;
  }

  .logo{
    text-align:center;
    font-size: clamp(22px, 5vw, 40px);
    letter-spacing:.32em;
    font-weight: 800;
    color:#fff;
    text-shadow: 0 0 18px var(--glow), 0 0 44px var(--glow);
    transition: text-shadow .6s;
  }
  .tagline{
    text-align:center;
    color:var(--dim);
    font-size: 12px;
    letter-spacing:.25em;
    text-transform:uppercase;
    margin-top:-8px;
  }

  header{
    text-align:center;
    padding: 6px 0 2px;
  }
  #title{
    font-size: clamp(15px,3vw,19px);
    color:var(--accent);
    font-weight:700;
    letter-spacing:.08em;
    text-shadow:0 0 14px var(--glow);
    transition: color .5s;
  }
  #subtitle{
    color:var(--dim);
    font-size:12.5px;
    margin-top:6px;
    line-height:1.5;
    min-height:20px;
  }

  #organism{
    height: 130px;
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .core{
    width:74px; height:74px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff 0%, var(--glow) 30%, transparent 72%);
    box-shadow: 0 0 40px 8px var(--glow), inset 0 0 30px rgba(255,255,255,.45);
    animation: pulse 2.6s ease-in-out infinite;
    transition: transform .6s cubic-bezier(.2,1.4,.4,1), box-shadow .6s, background .6s;
    position:relative;
  }
  .core::after{
    content:'';
    position:absolute; inset:-18px;
    border-radius:50%;
    border:1px solid var(--glow);
    opacity:.25;
    animation: ring 3.6s ease-out infinite;
  }
  @keyframes pulse{ 0%,100%{ filter:brightness(1);} 50%{ filter:brightness(1.35);} }
  @keyframes ring{ 0%{ transform:scale(.8); opacity:.4;} 100%{ transform:scale(1.6); opacity:0;} }

  .panel{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    backdrop-filter: blur(8px);
  }

  .stat-row{
    display:flex; flex-wrap:wrap; align-items:center; gap:8px;
    margin-bottom:10px;
  }
  .cname{
    font-weight:800; color:#fff; font-size:15px;
    text-shadow:0 0 10px var(--glow);
    margin-right:4px;
  }
  .badge{
    font-size:11px; color:var(--accent);
    border:1px solid var(--border);
    background:rgba(255,255,255,.04);
    padding:2px 7px; border-radius:6px;
  }

  .bar-wrap{ display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
  .bar{
    position:relative;
    height:20px;
    background: rgba(255,255,255,.05);
    border:1px solid var(--border);
    border-radius:6px;
    overflow:hidden;
  }
  .bar .fill{
    height:100%; width:0%;
    transition: width .45s ease;
    border-radius:5px;
  }
  .bar.energy .fill{ background: linear-gradient(90deg,#22c55e,#a3e635); box-shadow:0 0 14px rgba(74,222,128,.5); }
  .bar.biomass .fill{ background: linear-gradient(90deg,#f59e0b,#fde047); box-shadow:0 0 14px rgba(251,191,36,.5); }
  .bar span{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size:10.5px; letter-spacing:.08em;
    color:#fff; text-shadow:0 1px 2px #000;
    font-weight:600;
  }

  .traits{ display:flex; flex-wrap:wrap; gap:6px; min-height:20px; }
  .trait{
    font-size:10.5px;
    padding:2px 8px;
    border-radius:20px;
    background: rgba(125,249,255,.1);
    border:1px solid rgba(125,249,255,.35);
    color:var(--accent);
  }
  .dim{ color:var(--dim); font-size:11px; }

  #log{
    height: 170px;
    overflow-y:auto;
    font-size: 12.5px;
    line-height:1.7;
    display:flex; flex-direction:column; gap:2px;
  }
  #log::-webkit-scrollbar{ width:6px; }
  #log::-webkit-scrollbar-thumb{ background:rgba(120,160,255,.3); border-radius:3px; }
  #log .l{ padding-left:14px; position:relative; }
  #log .l::before{ content:'›'; position:absolute; left:0; color:var(--dim); }
  #log .good{ color:var(--good); }
  #log .bad{ color:var(--bad); }
  #log .warn{ color:var(--warn); }
  #log .info{ color:var(--accent); }
  #log .dim{ color:var(--dim); }

  #actions{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap:10px;
  }
  .act{
    text-align:left;
    background: var(--panel-2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    cursor:pointer;
    color:var(--text);
    font-family:inherit;
    transition: all .18s ease;
    display:flex; flex-direction:column; gap:3px;
  }
  .act:hover{
    border-color: var(--accent);
    background: rgba(30,40,80,.9);
    transform: translateY(-2px);
    box-shadow: 0 6px 22px -8px var(--glow);
  }
  .act:active{ transform: translateY(0); }
  .act .title{ font-size:13.5px; font-weight:700; color:#fff; }
  .act .desc{ font-size:11px; color:var(--dim); line-height:1.4; }
  .act.primary{ border-color:var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .act.primary .title{ color:var(--accent); }
  .act.back{ opacity:.7; }
  .act.back .title{ color:var(--dim); }
  .act.danger:hover{ border-color:var(--bad); box-shadow:0 6px 22px -8px var(--bad); }

  @media (max-width:520px){
    #app{ padding:16px 12px 50px; }
    #organism{ height:100px; }
    .core{ width:60px; height:60px; }
  }
</style>
</head>
<body data-stage="start">
<canvas id="bg"></canvas>

<div id="app">
  <div class="logo">XENOGENESIS</div>
  <div class="tagline">Alien Evolution — Vertical Slice</div>

  <header>
    <div id="title">Bereit zum Start</div>
    <div id="subtitle">Vom Einzeller zum Landbewohner — oder zum Leviathan der Tiefe.</div>
  </header>

  <div id="organism"><div class="core" id="core"></div></div>

  <div id="statsPanel" class="panel" style="display:none"></div>
  <div id="log" class="panel"></div>
  <div id="actions"></div>
</div>

<script>
/* =========================================================
   HINTERGRUND-PARTIKEL
   ========================================================= */
const bg = document.getElementById('bg');
const ctx = bg.getContext('2d');
let particles = [];
function resizeBg(){ bg.width = innerWidth; bg.height = innerHeight; }
addEventListener('resize', resizeBg); resizeBg();

for (let i=0;i<90;i++){
  particles.push({
    x: Math.random()*bg.width,
    y: Math.random()*bg.height,
    r: Math.random()*2+0.4,
    vx:(Math.random()-0.5)*0.25,
    vy:(Math.random()-0.5)*0.25,
    hue: 240 + Math.random()*110
  });
}
function loopBg(){
  ctx.clearRect(0,0,bg.width,bg.height);
  for(const p of particles){
    p.x += p.vx; p.y += p.vy;
    if(p.x < -10) p.x = bg.width+10;
    if(p.x > bg.width+10) p.x = -10;
    if(p.y < -10) p.y = bg.height+10;
    if(p.y > bg.height+10) p.y = -10;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle = `hsla(${p.hue},85%,72%,0.45)`;
    ctx.fill();
  }
  requestAnimationFrame(loopBg);
}
loopBg();

/* =========================================================
   DOM-REFS
   ========================================================= */
const elTitle    = document.getElementById('title');
const elSubtitle = document.getElementById('subtitle');
const elStats    = document.getElementById('statsPanel');
const elLog      = document.getElementById('log');
const elActions  = document.getElementById('actions');
const elCore     = document.getElementById('core');

/* =========================================================
   TRAIT-DEFINITIONEN
   ========================================================= */
const TRAITS = [
  { id:'flagellum', name:'Geißel',          desc:'+3 Speed, -5 MaxEnergie',       cost:2, minStage:0, d:{speed:3, maxEnergy:-5} },
  { id:'membrane',  name:'Membranpanzer',   desc:'+3 Verteidigung, -1 Speed',     cost:2, minStage:0, d:{defense:3, speed:-1} },
  { id:'toxin',     name:'Toxinvesikel',    desc:'+2 Angriff, +1 Verteidigung',   cost:2, minStage:0, d:{attack:2, defense:1} },
  { id:'photo',     name:'Photosynthese',   desc:'+15 MaxEnergie',                cost:3, minStage:0, d:{maxEnergy:15} },
  { id:'senses',    name:'Sinnesborsten',   desc:'+2 Sinne',                      cost:2, minStage:0, d:{senses:2} },
  { id:'nucleus',   name:'Zellkern',        desc:'+1 Speed, +2 Sinne, +10 MaxE',  cost:4, minStage:1, d:{speed:1, senses:2, maxEnergy:10} },
  { id:'armor',     name:'Hornhaut',        desc:'+2 Verteidigung',               cost:4, minStage:1, d:{defense:2} },
  { id:'spores',    name:'Sporenbildung',   desc:'+2 Fortpflanzung',              cost:3, minStage:1, d:{repro:2} },
  { id:'claws',     name:'Klauen',          desc:'+3 Angriff',                    cost:5, minStage:2, d:{attack:3} },
  { id:'sonar',     name:'Echosinn',        desc:'+3 Sinne, Tiefsee-tauglich',    cost:5, minStage:2, d:{senses:3} },
  { id:'lung',      name:'Lunge',           desc:'Landgang ohne Trockenheits-Malus', cost:6, minStage:2, d:{maxEnergy:20} },
  { id:'limbs',     name:'Gliedmaßen',      desc:'+2 Speed',                      cost:6, minStage:2, d:{speed:2} },
  { id:'wings',     name:'Membranflügel',   desc:'+4 Speed',                      cost:8, minStage:3, d:{speed:4} },
  { id:'jaws',      name:'Rachenkiefer',    desc:'+4 Angriff',                    cost:8, minStage:3, d:{attack:4} },
];

/* =========================================================
   SPIELZUSTAND
   ========================================================= */
const G = {
  c: null,
  phase: 'start',
  turn: 0,
  refresh: null,   // aktuelle Action-Refresh-Funktion
};

/* =========================================================
   HELFER
   ========================================================= */
const rnd   = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const chance = p => Math.random() < p;
const clampEnergy = () => { G.c.energy = Math.max(0, Math.min(G.c.energy, G.c.maxEnergy)); };
const dead   = () => G.c.energy <= 0;

function newCreature(){
  return {
    name:'Protozoon', size:1, speed:1, energy:60, maxEnergy:100,
    defense:1, senses:1, repro:1, attack:1, biomass:0,
    stage:0, aquatic:true, traits:[],
    hasLung:false, hasLimbs:false, hasSonar:false, hasArmor:false
  };
}

function setTitle(t, s){
  elTitle.textContent = t;
  if (s !== undefined) elSubtitle.textContent = s;
}

function log(text, cls='info'){
  const d = document.createElement('div');
  d.className = 'l ' + cls;
  d.textContent = text;
  elLog.appendChild(d);
  elLog.scrollTop = elLog.scrollHeight;
}

function setActions(list){
  elActions.innerHTML = '';
  list.forEach(a => {
    const b = document.createElement('button');
    b.className = 'act ' + (a.cls || '');
    b.innerHTML = `<span class="title">${a.label}</span>` +
                  (a.desc ? `<span class="desc">${a.desc}</span>` : '');
    b.onclick = () => { if (!b.disabled) a.fn(); };
    elActions.appendChild(b);
  });
}

function renderStats(){
  const c = G.c;
  elStats.style.display = 'block';
  const traitNames = c.traits.map(id => TRAITS.find(t=>t.id===id).name);
  elStats.innerHTML = `
    <div class="stat-row">
      <span class="cname">${c.name}</span>
      <span class="badge">Größe ${c.size}</span>
      <span class="badge">Speed ${c.speed}</span>
      <span class="badge">Def ${c.defense}</span>
      <span class="badge">Atk ${c.attack}</span>
      <span class="badge">Sinne ${c.senses}</span>
      <span class="badge">Repro ${c.repro}</span>
    </div>
    <div class="bar-wrap">
      <div class="bar energy">
        <div class="fill" style="width:${(c.energy/c.maxEnergy*100).toFixed(1)}%"></div>
        <span>ENERGIE ${c.energy} / ${c.maxEnergy}</span>
      </div>
      <div class="bar biomass">
        <div class="fill" style="width:${Math.min(100, c.biomass/30*100).toFixed(1)}%"></div>
        <span>BIOMASSE ${c.biomass}</span>
      </div>
    </div>
    <div class="traits">
      ${traitNames.length
        ? traitNames.map(n=>`<span class="trait">${n}</span>`).join('')
        : '<span class="dim">keine Mutationen</span>'}
    </div>
  `;
  elCore.style.transform = `scale(${(0.55 + c.size*0.13).toFixed(2)})`;
}

function applyTrait(t){
  const c = G.c;
  c.size      += t.d.size      || 0;
  c.speed     += t.d.speed     || 0;
  c.defense   += t.d.defense   || 0;
  c.senses    += t.d.senses    || 0;
  c.repro     += t.d.repro     || 0;
  c.attack    += t.d.attack    || 0;
  c.maxEnergy += t.d.maxEnergy || 0;
  if (c.energy > c.maxEnergy) c.energy = c.maxEnergy;
  if (t.id==='lung')  c.hasLung  = true;
  if (t.id==='limbs') c.hasLimbs = true;
  if (t.id==='sonar') c.hasSonar = true;
  if (t.id==='armor') c.hasArmor = true;
  c.traits.push(t.id);
}

/* =========================================================
   EVOLUTIONS-MENÜ
   ========================================================= */
function doEvolution(stage, back){
  const avail = TRAITS.filter(t => t.minStage <= stage && !G.c.traits.includes(t.id));
  if (avail.length === 0){
    log('Keine neuen Mutationen verfügbar.', 'dim');
    back();
    return;
  }
  setTitle('Evolution', 'Wähle eine Mutation — jede hat Vor- und Nachteile.');
  const list = avail.map(t => {
    const tooExpensive = G.c.biomass < t.cost;
    return {
      label: `${t.name} — ${t.cost} Biomasse`,
      desc: t.desc + (tooExpensive ? '  (zu wenig Biomasse)' : ''),
      fn: () => {
        if (G.c.biomass < t.cost){
          log(`Nicht genug Biomasse (${G.c.biomass}/${t.cost}).`, 'warn');
          return;
        }
        G.c.biomass -= t.cost;
        applyTrait(t);
        log(`Mutation erworben: ${t.name}`, 'good');
        back();
      }
    };
  });
  list.push({ label:'Zurück', desc:'Ohne Mutation fortfahren', fn: back, cls:'back' });
  setActions(list);
}

/* =========================================================
   ENDSCREENS
   ========================================================= */
function die(reason){
  G.phase = 'end';
  document.body.dataset.stage = 'dead';
  setTitle('Ausgestorben', reason);
  renderStats();
  log('DEINE LINIE STIRBT AUS.', 'bad');
  setActions([
    { label:'Neu starten', desc:'Eine neue Linie aus der Ursuppe beginnen', fn: startGame, cls:'primary' }
  ]);
}

function win(title, sub){
  G.phase = 'end';
  document.body.dataset.stage = 'win';
  setTitle(title, sub);
  renderStats();
  setActions([
    { label:'Neu starten', desc:'Eine andere Nische ausprobieren', fn: startGame, cls:'primary' }
  ]);
}

/* =========================================================
   STUFE 1 — BAKTERIE
   ========================================================= */
const BACTERIA_TARGET = 12;

function startBacteria(){
  G.phase = 'bacteria';
  G.turn = 0;
  document.body.dataset.stage = 'bacteria';
  setTitle('Stufe 1 — Einzeller', `Sammle ${BACTERIA_TARGET} Biomasse, um mehrzellig zu werden.`);
  renderStats();
  bacteriaActions();
}

function bacteriaEvent(){
  if (chance(0.35)){
    let dmg = rnd(5,15);
    if (G.c.defense > 2) dmg = Math.max(2, Math.floor(dmg/2));
    G.c.energy -= dmg;
    clampEnergy();
    log(`Eine Fresszelle greift dich an! -${dmg} Energie.`, 'bad');
  }
}

function bacteriaActions(){
  renderStats();
  if (dead()){ die('Einzeller ohne Energie.'); return; }
  if (G.c.biomass >= BACTERIA_TARGET){ toColony(); return; }

  setActions([
    { label:'Nährstoffe aufnehmen', desc:'+Energie, +Biomasse',
      fn: () => {
        const e = rnd(10,20), b = rnd(1,2);
        G.c.energy += e; clampEnergy();
        G.c.biomass += b;
        log(`Du absorbierst Nährstoffe. +${e} Energie, +${b} Biomasse.`, 'good');
        bacteriaEvent();
        bacteriaActions();
      }},
    { label:'Teilen', desc:'+3 Biomasse, kostet 20 Energie',
      fn: () => {
        if (G.c.energy < 20){ log('Zu wenig Energie zum Teilen.', 'warn'); return; }
        G.c.energy -= 20; clampEnergy();
        G.c.biomass += 3;
        log('Du teilst dich! +3 Biomasse.', 'good');
        bacteriaEvent();
        bacteriaActions();
      }},
    { label:'Wegschwimmen', desc:'Gefahr meiden',
      fn: () => {
        if (chance(0.7)) log('Du entkommst der Gefahr.', 'good');
        else {
          const d = rnd(5,10);
          G.c.energy -= d; clampEnergy();
          log(`Flucht misslingt! -${d} Energie.`, 'bad');
        }
        bacteriaEvent();
        bacteriaActions();
      }},
    { label:'Evolvieren', desc:'Mutationen ansehen', cls:'primary',
      fn: () => doEvolution(0, bacteriaActions) }
  ]);
}

function toColony(){
  log('Genug Biomasse! Deine Zellen schließen sich zu einem Verband zusammen.', 'good');
  G.c.stage = 1;
  G.c.name = 'Kolonie';
  G.c.maxEnergy += 20;
  G.c.energy = G.c.maxEnergy;
  G.c.biomass += 2;
  setTimeout(startColony, 400);
}

/* =========================================================
   STUFE 2 — KOLONIE
   ========================================================= */
function startColony(){
  G.phase = 'colony';
  document.body.dataset.stage = 'colony';
  setTitle('Stufe 2 — Mehrzeller-Kolonie', 'Deine Zellen spezialisieren sich. Wähle deine Richtung.');
  renderStats();
  setActions([
    { label:'Panzer-Kolonie', desc:'+3 Verteidigung, -1 Speed',
      fn: () => { G.c.defense += 3; G.c.speed = Math.max(1, G.c.speed-1); colonyGrow('Du wirst zur Panzer-Kolonie.'); } },
    { label:'Jäger-Kolonie', desc:'+2 Angriff, +1 Speed',
      fn: () => { G.c.attack += 2; G.c.speed += 1; colonyGrow('Du wirst zur Jäger-Kolonie.'); } },
    { label:'Symbiont-Kolonie', desc:'+15 MaxEnergie, +2 Fortpflanzung',
      fn: () => { G.c.maxEnergy += 15; G.c.repro += 2; G.c.energy = G.c.maxEnergy; colonyGrow('Du wirst zur Symbiont-Kolonie.'); } },
  ]);
}

function colonyGrow(text){
  log(text, 'good');
  setTitle('Stufe 2 — Wachstum', 'Deine Kolonie wächst über mehrere Zyklen...');
  setActions([]);
  let i = 0;
  const tick = () => {
    i++;
    G.c.biomass += rnd(1,2);
    G.c.energy += rnd(5,10); clampEnergy();
    log(`Zyklus ${i}: +Biomasse, +Energie.`, 'dim');
    renderStats();
    if (i < 4){ setTimeout(tick, 260); }
    else {
      log('Deine Kolonie hat sich gefestigt. Wähle eine Mutation.', 'info');
      doEvolution(1, toAquatic);
    }
  };
  setTimeout(tick, 300);
}

function toAquatic(){
  G.c.stage = 2;
  G.c.name = 'Aquatisches Wesen';
  G.c.size += 2;
  G.c.maxEnergy += 20;
  G.c.energy = G.c.maxEnergy;
  setTimeout(startAquatic, 400);
}

/* =========================================================
   STUFE 3 — WASSERWESEN
   ========================================================= */
const AQUATIC_TURNS = 8;

function startAquatic(){
  G.phase = 'aquatic';
  G.turn = 0;
  document.body.dataset.stage = 'aquatic';
  setTitle('Stufe 3 — Wasserwesen',
    'Du schwimmst durch eine fremde, biolumineszente See. Jage, wachse — und bereite dich auf den Landgang vor.');
  log('Deine Kolonie formt einen Körper. Du bist jetzt ein Wasserwesen.', 'good');
  aquaticActions();
}

function aquaticEvent(){
  if (chance(0.30)){
    let dmg = rnd(8,20);
    dmg = Math.max(3, dmg - G.c.defense);
    G.c.energy -= dmg; clampEnergy();
    log(`Ein Raubfisch greift an! -${dmg} Energie.`, 'bad');
  }
}

function aquaticActions(){
  renderStats();
  if (dead()){ die('Im Wasser verschlungen.'); return; }
  if (G.turn >= AQUATIC_TURNS){ toChoice(); return; }

  setTitle('Stufe 3 — Wasserwesen',
    `Tauchgang ${G.turn + 1} / ${AQUATIC_TURNS}  ·  Ziel: den Landgang erreichen`);

  setActions([
    { label:'Jagen', desc:'+Biomasse, kleines Verletzungsrisiko',
      fn: () => {
        G.turn++;
        const b = rnd(2,4) + Math.floor(G.c.attack/2);
        const e = rnd(3,8);
        G.c.biomass += b;
        G.c.energy += e; clampEnergy();
        log(`Erfolgreiche Jagd! +${b} Biomasse, +${e} Energie.`, 'good');
        if (chance(0.25)){
          const d = rnd(5,12);
          G.c.energy -= d; clampEnergy();
          log(`Beute wehrt sich! -${d} Energie.`, 'bad');
        }
        aquaticEvent();
        aquaticActions();
      }},
    { label:'Lauern', desc:'+Energie, kleine Biomasse',
      fn: () => {
        G.turn++;
        const e = rnd(10,18);
        G.c.energy += e; clampEnergy();
        G.c.biomass += 1;
        log(`Du lauerst im Verborgenen. +${e} Energie, +1 Biomasse.`, 'good');
        aquaticEvent();
        aquaticActions();
      }},
    { label:'Erkunden', desc:'+Sinne, +Biomasse, riskant',
      fn: () => {
        G.turn++;
        if (chance(0.6)){
          G.c.senses += 1; G.c.biomass += 2;
          log('Du entdeckst eine neue Zone. +1 Sinne, +2 Biomasse.', 'good');
        } else {
          const d = rnd(10,20);
          G.c.energy -= d; clampEnergy();
          log(`Gefahr im Dunkeln! -${d} Energie.`, 'bad');
        }
        aquaticEvent();
        aquaticActions();
      }},
    { label:'Evolvieren', desc:'Mutationen ansehen', cls:'primary',
      fn: () => doEvolution(2, aquaticActions) }
  ]);
}

function toChoice(){
  G.c.size += 2;
  G.c.maxEnergy += 10;
  G.c.energy = G.c.maxEnergy;
  setTimeout(startChoice, 400);
}

/* =========================================================
   STUFE 4 — LANDGANG-ENTSCHEIDUNG
   ========================================================= */
function startChoice(){
  G.phase = 'choice';
  document.body.dataset.stage = 'choice';
  setTitle('Stufe 4 — Der Landgang',
    'Vor dir liegt ein fremder Strand. Hinter dir die Tiefe. Deine Wahl entscheidet über deinen gesamten Evolutionspfad.');
  log('Du spürst flaches Wasser. Ein fremder Strand liegt vor dir.', 'info');
  renderStats();

  setActions([
    { label:'An Land kriechen', desc:'Werde eine Landkreatur — Lunge & Gliedmaßen empfohlen', cls:'primary',
      fn: () => {
        log('Du verlässt das Wasser.', 'good');
        if (!G.c.hasLung && !G.c.hasLimbs){
          log('Ohne Lunge oder Gliedmaßen leidest du an Trockenheit! -20 Energie.', 'bad');
          G.c.energy -= 20; clampEnergy();
          if (dead()){ die('Trockenheit besiegt dich am Strand.'); return; }
        }
        G.c.aquatic = false;
        G.c.stage = 3;
        G.c.name = 'Landkreatur';
        setTimeout(startLand, 350);
      }},
    { label:'In der Tiefe bleiben', desc:'Werde ein Leviathan — Echosinn hilft', cls:'primary',
      fn: () => {
        log('Du bleibst in der Tiefe.', 'info');
        G.c.stage = 3;
        G.c.name = 'Tiefsee-Leviathan';
        setTimeout(startFish, 350);
      }},
  ]);
}

/* =========================================================
   STUFE 5a — LAND-PFAD
   ========================================================= */
const LAND_TURNS = 6;

function startLand(){
  G.phase = 'land';
  G.turn = 0;
  document.body.dataset.stage = 'land';
  setTitle('Stufe 5 — Landkreatur', 'Du atmest fremde Luft. Der Boden ist warm. Leben überall.');
  landActions();
}

function landActions(){
  renderStats();
  if (dead()){ die('Deine Linie stirbt an Land aus.'); return; }
  if (G.turn >= LAND_TURNS){
    win('ENDE — Terranische Kreatur',
      `Du hast dich an Land etabliert. Eine neue Ära beginnt. Biomasse: ${G.c.biomass} · Mutationen: ${G.c.traits.length}`);
    return;
  }

  setTitle('Stufe 5 — Landkreatur', `Tag ${G.turn + 1} / ${LAND_TURNS}`);

  setActions([
    { label:'Jagen', desc:'+Biomasse, +Angriff-Erfahrung',
      fn: () => {
        G.turn++;
        const b = rnd(3,6) + G.c.attack;
        const e = rnd(2,6);
        G.c.biomass += b;
        G.c.energy += e; clampEnergy();
        log(`Erfolgreiche Jagd! +${b} Biomasse.`, 'good');
        landActions();
      }},
    { label:'Nest bauen', desc:'+Energie, +Fortpflanzung',
      fn: () => {
        G.turn++;
        const e = rnd(12,20);
        G.c.energy += e; clampEnergy();
        G.c.repro += 1;
        log(`Nest gebaut. +${e} Energie, +1 Fortpflanzung.`, 'good');
        landActions();
      }},
    { label:'Territorium erkunden', desc:'+Sinne, +Biomasse, riskant',
      fn: () => {
        G.turn++;
        G.c.senses += 1;
        G.c.biomass += 2;
        log('Du entdeckst neue Gebiete. +1 Sinne, +2 Biomasse.', 'good');
        if (chance(0.2)){
          const d = rnd(8,16);
          G.c.energy -= d; clampEnergy();
          log(`Ein Räuber überrascht dich! -${d} Energie.`, 'bad');
        }
        landActions();
      }},
    { label:'Evolvieren', desc:'Mutationen ansehen', cls:'primary',
      fn: () => doEvolution(3, landActions) }
  ]);
}

/* =========================================================
   STUFE 5b — FISCH-PFAD
   ========================================================= */
const FISH_TURNS = 6;

function startFish(){
  G.phase = 'fish';
  G.turn = 0;
  document.body.dataset.stage = 'fish';
  setTitle('Stufe 5 — Leviathan', 'Du bleibst in der Tiefe. Druck, Dunkelheit, enorme Räuber.');
  fishActions();
}

function fishActions(){
  renderStats();
  if (dead()){ die('Deine Linie verschwindet in der Dunkelheit.'); return; }
  if (G.turn >= FISH_TURNS){
    win('ENDE — Tiefsee-Leviathan',
      `Du bist der Apex der Tiefe. Biomasse: ${G.c.biomass} · Mutationen: ${G.c.traits.length}`);
    return;
  }

  setTitle('Stufe 5 — Leviathan', `Tauchgang ${G.turn + 1} / ${FISH_TURNS}`);

  setActions([
    { label:'Jagen', desc:'+Biomasse',
      fn: () => {
        G.turn++;
        const b = rnd(4,7) + G.c.attack;
        const e = rnd(4,10);
        G.c.biomass += b;
        G.c.energy += e; clampEnergy();
        log(`Beute erlegt! +${b} Biomasse.`, 'good');
        if (chance(0.35)){
          let dmg = rnd(10,22) - G.c.defense;
          dmg = Math.max(3, dmg);
          G.c.energy -= dmg; clampEnergy();
          log(`Ein Tiefsee-Räuber greift an! -${dmg} Energie.`, 'bad');
        }
        fishActions();
      }},
    { label:'Sonar nutzen', desc:'+Sinne, +Biomasse (mit Echosinn sicher)',
      fn: () => {
        G.turn++;
        if (G.c.hasSonar || chance(0.5)){
          G.c.senses += 1; G.c.biomass += 3;
          log('Sonar findet Beute. +1 Sinne, +3 Biomasse.', 'good');
        } else {
          log('Ohne Echosinn findest du nichts.', 'warn');
        }
        if (chance(0.3)){
          let dmg = Math.max(3, rnd(8,18) - G.c.defense);
          G.c.energy -= dmg; clampEnergy();
          log(`Ein Räuber lauert! -${dmg} Energie.`, 'bad');
        }
        fishActions();
      }},
    { label:'Häuten', desc:'+1 Verteidigung, kostet 10 Energie',
      fn: () => {
        G.turn++;
        if (G.c.energy < 10){ log('Zu wenig Energie zum Häuten.', 'warn'); return; }
        G.c.energy -= 10; clampEnergy();
        G.c.defense += 1;
        log('Du häutest dich. +1 Verteidigung.', 'good');
        fishActions();
      }},
    { label:'Evolvieren', desc:'Mutationen ansehen', cls:'primary',
      fn: () => doEvolution(3, fishActions) }
  ]);
}

/* =========================================================
   STARTSCREEN & INIT
   ========================================================= */
function startScreen(){
  G.phase = 'start';
  document.body.dataset.stage = 'bacteria';
  elStats.style.display = 'none';
  elLog.innerHTML = '';
  setTitle('Ursuppe', 'Ein neuer Einzeller entsteht...');
  elCore.style.transform = 'scale(0.6)';

  log('Willkommen bei XENOGENESIS.', 'info');
  log('Du beginnst als winzige Bakterie in einer fremden Ursuppe.', 'dim');
  log('Friss, teile dich, mutiere — und entscheide später, ob du Land oder Tiefe wählst.', 'dim');

  setActions([
    { label:'Spiel starten', desc:'Vom Einzeller zur Kreatur', cls:'primary', fn: startGame }
  ]);
}

function startGame(){
  G.c = newCreature();
  G.turn = 0;
  elLog.innerHTML = '';
  elStats.style.display = 'block';
  log('Ein neuer Einzeller entsteht in der Ursuppe...', 'dim');
  startBacteria();
}

/* Los geht's */
startScreen();
</script>
